
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gupta Dental Clinic - Payment Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #f4f8fc;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            color: #33465b;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(ellipse at top, rgba(220, 239, 255, .64), transparent 48%),
                #f4f8fc;
        }

        .payment-card {
            width: min(100%, 460px);
            padding: 46px 42px 38px;
            border: 1px solid #e4edf5;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(8, 43, 82, .09);
            text-align: center;
        }

        .payment-card h2 {
            margin: 0;
            color: #082b52;
            font-size: clamp(1.55rem, 5vw, 1.85rem);
            font-weight: 700;
            letter-spacing: -.035em;
            line-height: 1.25;
        }

        .payment-intro {
            margin: 16px 0 30px;
            color: #64758a;
            font-size: 1rem;
            line-height: 1.6;
        }

        .fee-amount {
            display: inline-block;
            margin-left: 5px;
            padding: 4px 11px;
            border: 1px solid #d5e8fb;
            border-radius: 999px;
            background: #edf6ff;
            color: #0866c6;
            font-size: 1.05rem;
            font-weight: 700;
            white-space: nowrap;
        }

        #payButton {
            width: 100%;
            min-height: 54px;
            padding: 14px 22px;
            border: 0;
            border-radius: 12px;
            background: #0866c6;
            box-shadow: 0 8px 18px rgba(8, 102, 198, .18);
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .18s ease,
                box-shadow .18s ease,
                transform .18s ease;
        }

        #payButton:hover:not(:disabled) {
            transform: translateY(-1px);
            background: #0756a8;
            box-shadow: 0 10px 22px rgba(8, 102, 198, .24);
        }

        #payButton:focus-visible {
            outline: 3px solid rgba(8, 102, 198, .3);
            outline-offset: 3px;
        }

        #payButton:disabled {
            box-shadow: none;
            cursor: not-allowed;
            opacity: .68;
        }

        #paymentMessage {
            margin: 20px 0 0;
            padding: 12px 14px;
            border: 1px solid #dceaf6;
            border-radius: 10px;
            background: #f5faff;
            color: #38536e;
            font-size: .9rem;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        #paymentMessage:empty {
            display: none;
        }

        #paymentMessage.success {
            border-color: #b8e5ce;
            background: #effaf4;
            color: #176b3a;
        }

        #paymentMessage.error {
            border-color: #f0caca;
            background: #fff5f5;
            color: #a52b2b;
        }

        #paymentMessage.warning {
            border-color: #f0dfad;
            background: #fffaf0;
            color: #805b12;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .payment-card {
                padding: 36px 24px 28px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #payButton {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="payment-card">

        <h2>Gupta Dental Clinic</h2>

        <p class="payment-intro">
            Test Mode Payment
            <span class="fee-amount">₹5</span>
        </p>

        <button id="payButton">
            Pay ₹5
        </button>

        <p id="paymentMessage" role="status" aria-live="polite"></p>

    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const payButton = document.getElementById('payButton');
        const paymentMessage = document.getElementById('paymentMessage');

        // Retain the order during retries on this page.
        let currentOrder = null;

        let paymentCompleted = false;
        let paymentVerificationPending = false;
        let paymentAttemptFailed = false;
        let checkoutOpening = false;

        function showMessage(message, type = '') {
            paymentMessage.textContent = message;
            paymentMessage.className = type;
        }

        function setButtonState(disabled, text = 'Pay ₹5') {
            payButton.disabled = disabled;
            payButton.textContent = text;
        }

        // Create an order only when one does not already exist.
        async function getOrCreateOrder() {

            if (currentOrder) {
                return currentOrder;
            }

            showMessage('Creating payment order...');

            const response = await fetch('api/create-order.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    purpose: 'enquiry_fee'
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success || !result.data) {
                throw new Error(
                    result.message || 'Unable to create payment order.'
                );
            }

            currentOrder = result.data;

            return currentOrder;
        }

        // Verify successful checkout response through the backend.
        async function verifyPayment(response) {

            paymentVerificationPending = true;

            showMessage(
                'Payment received. Verifying securely...'
            );

            setButtonState(true, 'Verifying Payment...');

            const verifyResponse = await fetch(
                'api/verify-payment.php',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(response)
                }
            );

            const result = await verifyResponse.json();

            // Payment is not yet captured.
            if (
                verifyResponse.status === 202 &&
                result.payment_pending
            ) {
                showMessage(
                    'Your payment is being processed. Please do not pay again. The clinic will verify the final status.',
                    'warning'
                );

                setButtonState(true, 'Payment Processing');

                return;
            }

            if (verifyResponse.ok && result.success) {

                paymentCompleted = true;
                paymentVerificationPending = false;

                const reference = result.data.reference;

                showMessage(
                    'Payment successful! Your enquiry reference is: ' +
                    reference,
                    'success'
                );

                setButtonState(true, 'Payment Successful');

                return;
            }

            throw new Error(
                result.message || 'Payment verification failed.'
            );
        }

        // Open Razorpay Checkout for the current order.
        async function openCheckout() {

            if (
                checkoutOpening ||
                paymentCompleted ||
                paymentVerificationPending
            ) {
                return;
            }

            checkoutOpening = true;
            paymentAttemptFailed = false;

            setButtonState(true, 'Opening Checkout...');

            try {

                const order = await getOrCreateOrder();

                const options = {

                    config: {
                        display: {
                            blocks: {
                                upi: {
                                    name: "Pay using UPI",
                                    instruments: [
                                        {
                                            method: "upi",
                                            flows: ["intent", "qr"],
                                            apps: [
                                                "phonepe",
                                                "google_pay",
                                                "paytm"
                                            ]
                                        }
                                    ]
                                }
                            },

                            sequence: ["block.upi"],

                            preferences: {
                                show_default_blocks: true
                            }
                        }
                    },

                    key: order.key_id,

                    amount: order.amount,
                    currency: order.currency,

                    name: 'Gupta Dental Clinic',
                    description: 'Dental Enquiry Fee',

                    order_id: order.order_id,

                    handler: async function (response) {

                        checkoutOpening = false;

                        try {
                            await verifyPayment(response);

                        } catch (error) {

                            // Do not create another order automatically.
                            // The payment may have succeeded even if verification
                            // failed due to a temporary network problem.

                            paymentVerificationPending = true;

                            showMessage(
                                'We received a payment response but could not confirm its final status. Please do not pay again. Contact the clinic for verification.',
                                'warning'
                            );

                            setButtonState(true, 'Verification Pending');
                        }
                    },

                    modal: {
                        ondismiss: function () {

                            checkoutOpening = false;

                            if (paymentCompleted || paymentVerificationPending) {
                                return;
                            }

                            if (paymentAttemptFailed) {
                                setButtonState(false, 'Retry Payment');

                                showMessage(
                                    'Your previous attempt failed. You can retry using the same payment order.',
                                    'error'
                                );

                                return;
                            }

                            // Closing checkout does not prove that payment failed.
                            // Do not automatically create another order.
                            setButtonState(false, 'Resume Payment');

                            showMessage(
                                'Checkout was closed. If you attempted payment, first confirm that no debit or pending transaction exists before retrying. The same order will be reused.',
                                'warning'
                            );
                        }
                    },

                    theme: {
                        color: '#176B57'
                    }
                };

                const razorpay = new Razorpay(options);

                razorpay.on('payment.failed', function (response) {

                    checkoutOpening = false;
                    paymentAttemptFailed = true;

                    const description =
                        response.error?.description ||
                        'Payment attempt failed.';

                    showMessage(
                        'Payment failed: ' + description +
                        ' You can retry using the same order.',
                        'error'
                    );

                    setButtonState(false, 'Retry Payment');
                });

                razorpay.open();

                checkoutOpening = false;

            } catch (error) {

                checkoutOpening = false;

                showMessage(error.message, 'error');

                setButtonState(false, 'Try Again');
            }
        }

        payButton.addEventListener('click', openCheckout);

    </script>

</body>
</html>
